name: Auto Daily Blog Post

on:
  schedule:
    # Runs daily at 06:00 UTC (11:00 AM Pakistan Time)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-generativeai

      - name: Generate Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_post.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "AIToolPulse Bot"
          git config --global user.email "bot@aitoolpulse.local"
          git add -A
          git commit -m "Auto publish fresh AI guide [skip ci]" || echo "No changes to commit"
          git push
